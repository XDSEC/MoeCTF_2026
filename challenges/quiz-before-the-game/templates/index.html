<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoeCTF 2026 预热小活动</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <h1>MoeCTF 2026 预热小活动</h1>
    </header>

    <main id="quiz">
      <!-- 加载状态 -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>加载题目中...</p>
      </div>

      <!-- 题目卡片 -->
      <div id="question-card" class="card hidden">
        <div class="question-number" id="q-number"></div>
        <h2 class="question-text" id="q-text"></h2>

        <div class="options" id="options">
          <!-- 由 JS 动态生成 -->
        </div>

        <!-- 结果区域（答完后显示） -->
        <div id="result" class="result hidden">
          <div id="result-icon" class="result-icon"></div>
          <p id="result-message" class="result-message"></p>
          <div id="explanation" class="explanation"></div>
        </div>

        <!-- 下一题按钮 -->
        <button id="next-btn" class="btn next-btn hidden">下一题 →</button>
      </div>

      <!-- 错误提示 -->
      <div id="error" class="error hidden">
        <p>😵 加载失败，请刷新页面重试</p>
      </div>
    </main>

    <footer>
      <p>本网站供 MoeCTF 2026 预热答题，与赛题、成绩无关。</p>
    </footer>
  </div>

  <!-- 五彩纸屑容器 -->
  <canvas id="confetti-canvas"></canvas>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
